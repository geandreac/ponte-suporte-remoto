<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Ponte — controle remoto ativo</title>
  <link rel="stylesheet" href="css/overlay.css">
  <script type="module" src="js/overlay.js"></script>
</head>
<body>
  <p class="msg" role="status"><span class="dot" aria-hidden="true"></span><span id="text">Controle remoto ativo</span></p>
  <div class="actions">
    <button id="minimize" type="button" class="ghost" aria-label="Minimizar aviso para a barra de tarefas" title="Minimizar para a barra de tarefas">–</button>
    <button id="stop" type="button">Parar</button>
  </div>
</body>
</html>
