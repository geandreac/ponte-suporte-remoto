name: Executáveis

# Gera os instaladores para Windows, macOS e Linux e publica uma Release "v<versão do package.json>".
# Dispara quando a versão (package.json) ou este workflow mudam na main, ao enviar uma tag vX.Y.Z,
# ou manualmente (aba Actions > Executáveis > Run workflow). A tag é criada pelo próprio GitHub.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Sem certificado de assinatura: os instaladores saem sem assinatura digital.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ponte-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versão
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ponte ${{ steps.version.outputs.tag }}
          prerelease: true
          files: artifacts/*
          generate_release_notes: true
          body: |
            Instaladores do Ponte (sem assinatura digital — veja o README para abrir no Windows e no macOS).
            Para conectar computadores diferentes é preciso um servidor de conexão com HTTPS (docs/IMPLANTACAO.md).
