name: Executáveis

# Gera os instaladores para Windows, macOS e Linux.
# - Manualmente: aba Actions > Executáveis > Run workflow (os arquivos ficam como artefatos).
# - Ao enviar uma tag vX.Y.Z: além dos artefatos, cria uma Release com os instaladores.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Sem certificado de assinatura: os instaladores saem sem assinatura digital.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ponte-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Instaladores do Ponte (sem assinatura digital — veja o README para abrir no Windows e no macOS).
            Para conectar computadores diferentes é preciso um servidor de conexão com HTTPS (docs/IMPLANTACAO.md).
